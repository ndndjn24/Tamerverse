<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>THAMERVERSE | THE PRESENCE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #020205;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 1. خلفية الضباب السديمي والنجوم الداكنة */
    canvas#spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .nebula-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
    }

    /* الحاوية الرئيسية */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
    }

    /* الشاشات التفاعلية */
    .step {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .step.active {
      display: flex;
      opacity: 1;
    }

    /* النصوص والخطوط الهيكلية السينمائية */
    .sub-title {
      font-size: 11px;
      letter-spacing: 4px;
      color: #777788;
      text-transform: uppercase;
      margin-bottom: 14px;
      font-weight: 400;
    }

    .main-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 10px;
      text-transform: uppercase;
      margin-bottom: 18px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .desc {
      font-size: 13px;
      line-height: 1.8;
      color: #aaaaaa;
      letter-spacing: 1.5px;
      font-weight: 300;
      margin-bottom: 30px;
    }

    /* إدخال بدون مربعات - سطر ناعم غامض */
    .input-wrapper {
      width: 100%;
      position: relative;
      margin-bottom: 35px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      text-align: center;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    input[type="text"]:focus {
      border-bottom-color: #ffffff;
      box-shadow: 0 1px 15px rgba(255, 255, 255, 0.1);
    }

    input[type="text"]::placeholder {
      color: #444455;
      letter-spacing: 3px;
    }

    /* زر بدون مربع - نص وهاج يتنفس */
    .btn-text {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 10px 20px;
      transition: all 0.3s ease;
      opacity: 0.8;
      animation: pulseText 3s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.5; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
      50% { opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.8); }
    }

    .btn-text:hover {
      opacity: 1;
      letter-spacing: 7px;
    }

    /* شاشة التحقق - سطر سينمائي واحد */
    .auth-single-line {
      font-size: 12px;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: uppercase;
      white-space: nowrap;
      animation: linePulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes linePulse {
      from { opacity: 0.4; letter-spacing: 4px; }
      to { opacity: 1; letter-spacing: 5px; text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); }
    }

    /* إطار الصورة الكونية الهائل */
    .cosmic-avatar-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 20px 0 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cosmic-avatar-container::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
      animation: avatarPulse 4s infinite alternate;
    }

    @keyframes avatarPulse {
      0% { transform: scale(0.9); opacity: 0.4; }
      100% { transform: scale(1.15); opacity: 0.8; }
    }

    .cosmic-avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- الضباب الكوني والنجوم -->
  <div class="nebula-glow"></div>
  <canvas id="spaceCanvas"></canvas>

  <div class="container">
    
    <!-- الخطوة 1: الواجهة الغامضة البدائية -->
    <div id="step1" class="step active">
      <div class="sub-title">This visit was decided long before you arrived.</div>
      <div class="main-title">THAMERVERSE</div>
      <div class="sub-title" style="margin-bottom: 45px;">Before existence had a name</div>

      <div class="input-wrapper">
        <input type="text" id="userName" placeholder="STATE YOUR NAME" autocomplete="off">
      </div>
      
      <button class="btn-text" onclick="requestEntry()">REQUEST ENTRY</button>
    </div>

    <!-- الخطوة 2: شاشة التصريح (سطر واحد فقط) -->
    <div id="step2" class="step">
      <div class="auth-single-line" id="authLine">ENTRY AUTHORIZED</div>
    </div>

    <!-- الخطوة 3: الحضور الكوني (THE PRESENCE) -->
    <div id="step3" class="step">
      <div class="main-title" style="font-size: 32px; margin-bottom: 6px;">THE PRESENCE</div>
      
      <div class="desc" style="margin-bottom: 0;">
        There was no first star.<br>
        There was only his awareness.
      </div>

      <!-- إطار الصورة المدمجة بالاسم الحقيقي لصورتك المرفوعة -->
      <div class="cosmic-avatar-container">
        <img src="IMG_2899.jpeg" alt="THAMER" class="cosmic-avatar">
      </div>

      <div class="desc">
        Before time was counted, he remained.<br>
        Civilizations vanish where patience ends.<br>
        <span id="observedText" style="color: #ffffff; font-weight: 500;">To be noticed by him is to be altered.</span>
      </div>
    </div>

  </div>

  <script>
    // 1. رسم الغبار الكوني السديمي
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 75; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.8,
        alpha: Math.random() * 0.6 + 0.1,
        speedY: (Math.random() - 0.5) * 0.2
      });
    }

    function animateSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.y += p.speedY;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        p.alpha += (Math.random() - 0.5) * 0.01;
        if (p.alpha < 0.1) p.alpha = 0.1;
        if (p.alpha > 0.7) p.alpha = 0.7;
      });

      requestAnimationFrame(animateSpace);
    }
    animateSpace();

    // 2. التحكم ببدء التجربة والعبور
    function requestEntry() {
      const name = document.getElementById('userName').value.trim();
      if (!name) return;

      if ('vibrate' in navigator) navigator.vibrate(15);

      document.getElementById('step1').classList.remove('active');
      
      setTimeout(() => {
        const authLine = document.getElementById('authLine');
        authLine.textContent = `ENTRY AUTHORIZED: ${name.toUpperCase()}`;
        document.getElementById('step2').classList.add('active');
      }, 500);

      setTimeout(() => {
        document.getElementById('step2').classList.remove('active');
        setTimeout(() => {
          document.getElementById('observedText').textContent = `${name.toUpperCase()} IS NOW OBSERVED BY HIM.`;
          document.getElementById('step3').classList.add('active');
        }, 600);
      }, 3000);
    }

    // إمكانية الضغط على Enter للعبور
    document.getElementById('userName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') requestEntry();
    });
  </script>
</body>
</html>
